name: Mailer

# Sends the next batch of queued emails through Gmail, then reads the mailbox
# for replies and bounces. All of it is configured in the web app.
#
# One job per Gmail account: with a single mailbox this is exactly the one job it always was;
# with several (the GMAIL_ACCOUNTS secret — see the README), they run in parallel, each with its
# own send pace and its own inbox, so one account's volume or reputation never affects another's.

on:
  # This is a backup: GitHub documents its own schedule trigger as best-effort, and it can
  # silently stop firing with no notification. The Worker's own Cloudflare Cron Trigger is what
  # actually drives sending reliably (see app/wrangler.json and the `scheduled` handler in
  # app/src/index.js), through the same workflow_dispatch below that "Run now" also uses. This
  # stays as a second chance in case that is ever unavailable (e.g. DISPATCH_TOKEN expired).
  schedule:
    - cron: '17 * * * *' # Every hour, away from the top of the hour when GitHub's scheduler is busiest.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mailboxes:
    name: List mailboxes
    runs-on: ubuntu-latest
    outputs:
      indexes: ${{ steps.list.outputs.indexes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Split in two: GitHub Actions silently blanks *any* $GITHUB_OUTPUT written by a step whose
      # own env holds a secret — regardless of the value, even a harmless list of small numbers —
      # so the step that can see the secrets writes to a plain file instead, and a separate step
      # with no secret in its own env reads that file and is the one that sets the output.
      - name: Count configured mailboxes
        run: node scripts/mailbox-matrix.mjs > mailbox-indexes.json
        env:
          GMAIL_ACCOUNTS: ${{ secrets.GMAIL_ACCOUNTS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - id: list
        run: echo "indexes=$(cat mailbox-indexes.json)" >> "$GITHUB_OUTPUT"

  run:
    name: Send and check
    needs: mailboxes
    if: needs.mailboxes.outputs.indexes != '[]'
    strategy:
      matrix:
        index: ${{ fromJson(needs.mailboxes.outputs.indexes) }}
      # One mailbox having a bad run (a wrong password, Gmail blocking it) should not stop the others.
      fail-fast: false
    # One run per mailbox at a time, so a mailbox's own inbox is never used by two runs at once.
    concurrency:
      group: mailer-${{ matrix.index }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: node runner/index.js
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ACCOUNTS: ${{ secrets.GMAIL_ACCOUNTS }}
          MAILBOX_INDEX: ${{ matrix.index }}
