name: Mailer

# Sends the next batch of queued emails through Gmail, then reads the mailbox
# for replies and bounces. All of it is configured in the web app.
#
# One job per Gmail account, up to MAILBOX_SLOTS (5) below. With a single mailbox this is
# exactly the one job it always was, plus a few unused slots that start, see there is no account
# configured for them, and end in a couple of seconds. With several (the GMAIL_ACCOUNTS secret —
# see the README), the used slots run in parallel, each with its own send pace and its own inbox,
# so one account's volume or reputation never affects another's.
#
# The slot count can't be computed from GMAIL_ACCOUNTS and handed to the matrix below: GitHub
# Actions blanks any `$GITHUB_OUTPUT` written anywhere in a job that has touched a secret,
# regardless of the output's own value, so there is no way to pass "how many accounts" between
# jobs without running into that. A fixed list of slots sidesteps it entirely — nothing here is
# ever derived from a secret. Need more than 5 mailboxes? Add more numbers to the list below.

on:
  # This is a backup: GitHub documents its own schedule trigger as best-effort, and it can
  # silently stop firing with no notification. The Worker's own Cloudflare Cron Trigger is what
  # actually drives sending reliably (see app/wrangler.json and the `scheduled` handler in
  # app/src/index.js), through the same workflow_dispatch below that "Run now" also uses. This
  # stays as a second chance in case that is ever unavailable (e.g. DISPATCH_TOKEN expired).
  schedule:
    - cron: '17 * * * *' # Every hour, away from the top of the hour when GitHub's scheduler is busiest.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: Send and check
    strategy:
      matrix:
        index: [0, 1, 2, 3, 4] # MAILBOX_SLOTS
      # One mailbox having a bad run (a wrong password, Gmail blocking it) should not stop the others.
      fail-fast: false
    # One run per mailbox slot at a time, so a mailbox's own inbox is never used by two runs at once.
    concurrency:
      group: mailer-${{ matrix.index }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - run: node runner/index.js
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ACCOUNTS: ${{ secrets.GMAIL_ACCOUNTS }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          MAILBOX_INDEX: ${{ matrix.index }}
